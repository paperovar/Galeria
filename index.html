<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Projektów 3D - Klasa 5</title>
    <style>
        /* Główne style i zmienne kolorystyczne nawiązujące do Tinkercad */
        :root {
            --primary-blue: #0082c8;
            --primary-hover: #006bb3;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Stylizacja Banera */
        .banner-wrapper {
            width: 100%;
            background-color: #eaf3f9; /* Delikatne tło pod banerem */
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .banner {
            max-width: 1000px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Panel nawigacyjny */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        button {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-color: white;
            cursor: pointer;
            flex-grow: 1;
            max-width: 300px;
        }

        /* Obszar wyświetlania projektów */
        .gallery-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .student-name {
            font-size: 28px;
            color: var(--primary-blue);
            margin-top: 0;
            margin-bottom: 5px;
        }

        .student-info {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Siatka projektów (dla wielu projektów jednego ucznia) */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            padding-bottom: 62.25%; /* Proporcje dla Tinkercad iframe */
            background-color: #f0f0f0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Status ładowania */
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-muted);
            font-weight: bold;
            z-index: 0;
        }

        /* Responsywność */
        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            select {
                max-width: 100%;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- Baner na samej górze strony (poza głównym kontenerem) -->
<div class="banner-wrapper">
    <img src="baner.png" alt="Projekty 3D Klasy 5 - Tinkercad" class="banner" onerror="this.style.display='none'">
</div>

<div class="container">
    <!-- Panel Sterowania (Karuzela) -->
    <div class="controls">
        <button id="btn-prev">❮ Poprzedni</button>
        <select id="student-select" aria-label="Wybierz ucznia"></select>
        <button id="btn-next">Następny ❯</button>
    </div>

    <!-- Miejsce wyświetlania projektów -->
    <div class="gallery-section">
        <h2 class="student-name" id="display-name">Wybierz ucznia</h2>
        <p class="student-info" id="display-counter">Ładowanie projektów...</p>
        
        <div class="projects-grid" id="projects-container">
            <!-- Tutaj dynamicznie będą wstrzykiwane iframy -->
        </div>
    </div>
</div>

<script>

        { name: "Marlena Materska", ids: ["kSbIN9wrZdT", "akVCC8HqauC"] },
        { name: "Martyna Cuper", ids: ["hfwfOZOzRDL"] },
        { name: "Szymon Hałek", ids: ["kX03zdIh5aJ", "e0Fm8oXdxqU"] },
        { name: "Natan Rybkowski", ids: ["3YqmFQNQMWX"] },
        { name: "Anastazja Maciejewska", ids: ["erTEXxA9Kbn"] },
        { name: "Franek Konarski", ids: ["fUXBhsDK9q3"] },
        { name: "Kacper Ciećwierz", ids: ["7cFqFmTAycG"] },
        { name: "Kacper Olczak", ids: ["iQvXc8BFCac", "9M2dgulATYM"] },
        { name: "Maciej Piotrowski", ids: ["7P9XWDmPedc"] },
        { name: "Nikola Bąk", ids: ["8IwMDWgU3l5"] },
        { name: "Wiktor Orężak", ids: ["bKfw8vuWu3q", "lbVJBJT9Ycd"] },
        { name: "Amelka Rakowska", ids: ["g8qxIVzXRDj", "4SXvzsj4XTy"] },
        { name: "Aneta Kiełbus", ids: ["1oPpchvOaH9", "cqH3HVe7BJ5"] },
        { name: "Gabriela Niemiec", ids: ["1T1lxnShu1o", "9SXvnXxyiY9"] },
        { name: "Jagoda Kulesza", ids: ["8IR0rzcfpIP", "2HtFZbCRjYT"] },
        { name: "Julia Gałązka", ids: ["4STTHDCtt97", "iX5f187fBg3"] },
        { name: "Kacper Jesionowski", ids: ["bxKgWKygjup"] },
        { name: "Karol Rudnicki", ids: ["8plXAkd2r9p", "kNows3sR6o5"] },
        { name: "Klaudia Odolczyk", ids: ["gYGUxrJe6O2", "bzRFBLzM86k"] },
        { name: "Liwia Sobota", ids: ["4ublHTnV23k", "8oyRlEnnEx1"] },
        { name: "Magdalena Kakietek", ids: ["8sO6AVdRZJQ"] },
        { name: "Mateusz jach", ids: ["he4SY36rKUt", "1tofj0EENIl"] },
        { name: "Szymon Maleńczuk", ids: ["4b9K5pUiXTl", "6mhgYDIcuZV", "5ecZ8guZGyi", "bAtX9CuVozw", "8wqLbOSpCcy"] },
        { name: "Adrian Zuchniewicz", ids: ["lOt3FSRvEt5"] },
        { name: "Julian Gawronek", ids: ["88J0ZyNcrKC", "1GK3wXz86uN", "lTzAkUTjccy"] },
        { name: "Kinga Gwiaździńska", ids: ["7GwEY0MEDHK"] },
        { name: "Lena Grochowska", ids: ["1pIJKJvbpFn", "9n4RLhzTJSO"] },
        { name: "Maja Wikary", ids: ["fQ8xtKD5JHm", "knqDzoQ6Rdx"] },
        { name: "Mikołaj Pliszka", ids: ["1Eof1pDx3c2"] },
        { name: "Oskar Niewiadomski", ids: ["c0XnWI9qpay", "8RvZP0MUUWq", "f7rpSzZMZAL", "ckwXh0WKeDn"] },
        { name: "Radek Marczak", ids: ["ig28lc2ORA8", "ezto92prFTk", "iOPPxebHejN", "akCDIKT0V7Q"] },
        { name: "Zuzanna Suchojad", ids: ["32MccRyAxi2", "fmvLPQSrCsp"] },
        { name: "Łukasz Zuchniewicz", ids: ["iyvY2BJwBHV"] }
    ];

    let currentIndex = 0;

    // Elementy DOM
    const studentSelect = document.getElementById('student-select');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const displayName = document.getElementById('display-name');
    const displayCounter = document.getElementById('display-counter');
    const projectsContainer = document.getElementById('projects-container');

    // Inicjalizacja listy rozwijanej
    function initSelect() {
        studentsData.forEach((student, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = student.name;
            studentSelect.appendChild(option);
        });

        studentSelect.addEventListener('change', (e) => {
            currentIndex = parseInt(e.target.value);
            renderStudent();
        });
    }

    // Główna funkcja renderująca projekty ucznia
    function renderStudent() {
        const student = studentsData[currentIndex];
        
        // Aktualizacja tekstów
        displayName.textContent = student.name;
        studentSelect.value = currentIndex;
        
        const projectCountText = student.ids.length === 1 ? "1 projekt" : `${student.ids.length} projekty`;
        displayCounter.textContent = `Wyświetlanie: Uczeń ${currentIndex + 1} z ${studentsData.length} (${projectCountText})`;

        // Czyszczenie poprzednich projektów (Zwalnianie pamięci przeglądarki!)
        projectsContainer.innerHTML = '';

        // Generowanie nowych iframe'ów
        student.ids.forEach(id => {
            const wrapper = document.createElement('div');
            wrapper.className = 'iframe-container';
            
            // Text wyświetlany zanim załaduje się 3D
            const loader = document.createElement('div');
            loader.className = 'loader';
            loader.textContent = 'Ładowanie środowiska 3D...';
            
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.tinkercad.com/embed/${id}`;
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('marginwidth', '0');
            iframe.setAttribute('marginheight', '0');
            iframe.setAttribute('scrolling', 'no');
            // Ukrywa loader gdy iframe się wczyta
            iframe.onload = () => { loader.style.display = 'none'; };

            wrapper.appendChild(loader);
            wrapper.appendChild(iframe);
            projectsContainer.appendChild(wrapper);
        });

        // Aktualizacja stanu przycisków
        btnPrev.disabled = currentIndex === 0;
        btnNext.disabled = currentIndex === studentsData.length - 1;
    }

    // Obsługa przycisków
    btnPrev.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderStudent();
        }
    });

    btnNext.addEventListener('click', () => {
        if (currentIndex < studentsData.length - 1) {
            currentIndex++;
            renderStudent();
        }
    });

    // Start aplikacji
    initSelect();
    renderStudent(); // Załaduj pierwszego ucznia na start
</script>

</body>
</html>
